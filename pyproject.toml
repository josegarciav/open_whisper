[project]
name = "open-whisper"
version = "0.2.0"
description = "Local Speech-to-Text with Voxtral and MLX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "mlx-audio>=0.1.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "huggingface_hub>=0.20.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pyperclip>=1.8.2",
    "soxr>=0.3.5",
]
